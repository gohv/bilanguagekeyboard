<!doctype html><meta name=viewport content="width=device-width,initial-scale=1">
<title>PolyBoard field test</title>
<style>body{font:16px system-ui;padding:16px;background:#111;color:#eee}
input,textarea{width:100%;font-size:16px;padding:10px;margin:4px 0 14px;box-sizing:border-box}
label{font-size:13px;opacity:.8}</style>
<h3>PolyBoard 6.1 field-gating fixtures</h3>
<label>password</label><input type="password" autocomplete="new-password">
<label>email</label><input type="email">
<label>url</label><input type="url">
<label>tel</label><input type="tel">
<label>number</label><input type="number">
<label>date</label><input type="date">
<label>plain text (should be translatable)</label><input type="text">
<label>textarea (multiline, translatable)</label><textarea rows="3"></textarea>
